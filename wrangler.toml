# Public template. Copy to ignored wrangler.production.toml for deployment.
name = "icloud-reminders-mcp-server"
main = "dist/server/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = false

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "icloud-reminders"
database_id = "replace-with-your-d1-database-id"

[vars]
TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
POLICY_AUD = "replace-with-your-access-application-aud"
APP_ORIGIN = "https://icloud-reminders-mcp-server.your-subdomain.workers.dev"
REMINDERS_OWNER_ID = ""
ENCRYPTION_KEY_ID = "primary"
LIVE_APPLE_CONNECTION_APPROVED = ""
APPLE_CRYPTO_REVIEW_APPROVED = ""
LIVE_APPLE_WRITES_APPROVED = ""

[observability]
enabled = true
