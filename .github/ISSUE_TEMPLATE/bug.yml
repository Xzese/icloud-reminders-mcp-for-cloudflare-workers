name: Bug report
description: Report a reproducible problem using sanitized or synthetic examples.
title: "[Bug]: "
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - ChatGPT Sites
        - Standalone Cloudflare Worker
        - Local development or CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include your Node.js version for local or build problems.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Include the affected dashboard action or MCP tool.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Share error codes or counts only. Remove account identifiers, cookies, tokens, reminder contents and signed URLs.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information
      options:
        - label: This report contains no credentials or private account data. Suspected vulnerabilities go through private security reporting.
          required: true
